services:
  - type: web
    name: freclean-contact-api
    runtime: node
    buildCommand: npm ci --ignore-scripts
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://freclean.com
      - key: FRECLEAN_REQUEST_RECIPIENT
        value: freclean7@gmail.com