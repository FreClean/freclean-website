services:
  - type: web
    name: freclean-contact-api
    runtime: node
    buildCommand: npm install --ignore-scripts
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://freclean.com