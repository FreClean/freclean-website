name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Validate static site
        run: sh scripts/validate-site.sh

      - name: Run request workflow tests
        run: node --test scripts/request-workflow.test.js

      - name: Run contact API tests
        run: npm test

      - name: Check JavaScript syntax
        run: node --check script.js

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        # Publish only after all static, browser, API, and syntax checks pass.
        uses: actions/deploy-pages@v4
