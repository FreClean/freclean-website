name: Deploy GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate asset paths
        run: |
          echo "Validating image path usage..."
          # Warn if any HTML references root-image filenames instead of assets/img/
          if grep -R "src=\"[a-zA-Z0-9_-]*\.png\"" --exclude-dir=.git --line-number . | grep -v "assets/img"; then
            echo "Warning: some HTML files reference image files directly at the repository root. Ensure images are placed under assets/img/.";
          else
            echo "Image paths look consistent (using assets/img/).";
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v3

      - name: Optimize images (CI)
        run: |
          echo "Installing webp tools and optimizing images..."
          sudo apt-get update && sudo apt-get install -y webp
          for img in assets/img/*.png; do
            [ -f "$img" ] || continue
            cwebp -q 80 "$img" -o "${img%.*}.webp" || true
          done
          for img in assets/img/*.jpg; do
            [ -f "$img" ] || continue
            cwebp -q 80 "$img" -o "${img%.*}.webp" || true
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: .

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
